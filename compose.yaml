services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventlink}
      POSTGRES_USER: ${POSTGRES_USER:-eventlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventlink_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      EVENTLINK_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-eventlink}:${POSTGRES_PASSWORD:-eventlink_dev_password}@db:5432/${POSTGRES_DB:-eventlink}
      EVENTLINK_JWT_SECRET_KEY: ${EVENTLINK_JWT_SECRET_KEY:-CHANGE_ME_IN_PRODUCTION}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
